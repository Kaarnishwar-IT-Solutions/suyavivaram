[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openresume"
version = "2.0.0"
description = "An open, renderer-agnostic resume format: XML/JSON source of truth, rendered to PDF."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kaarnishwar IT Solutions", email = "connect@kaarnishwar.com" }]
keywords = ["resume", "cv", "xml", "json", "pdf", "open-standard", "ats", "hr-tech"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: XML",
  "Topic :: Office/Business",
]
dependencies = [
  "lxml>=4.9",
  "reportlab>=3.6",
  "PyMuPDF>=1.23",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.urls]
Homepage = "https://github.com/Kaarnishwar-IT-Solutions/openresume"
Repository = "https://github.com/Kaarnishwar-IT-Solutions/openresume"
Changelog = "https://github.com/Kaarnishwar-IT-Solutions/openresume/blob/main/CHANGELOG.md"

[project.scripts]
openresume = "openresume.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openresume = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
